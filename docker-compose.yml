# ai-ide-gateway 统一编排：router(对外) + qoder + codebuddy + checkin
# 用法：cp .env.example .env && 填好 key，然后 docker compose up -d --build

services:
  # ---------- 统一对外入口 ----------
  router:
    build:
      context: .
      dockerfile: docker/router.Dockerfile
    image: ai-ide-gateway/router
    restart: unless-stopped
    ports:
      - "8080:8080"          # 面板、统一 API 和两个后端控制台共用的唯一入口
    environment:
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-}
      QODER_BASE_URL: http://qoder:5050
      CODEBUDDY_BASE_URL: http://codebuddy:8787
      QODER_BACKEND_KEY: ${QODER_BACKEND_KEY:-}
      QODER_ADMIN_PASSWORD: ${QODER_ADMIN_PASSWORD:?请在 .env 设置 QODER_ADMIN_PASSWORD}
      CODEBUDDY_BACKEND_KEY: ${CODEBUDDY_BACKEND_KEY:-}
      CODEBUDDY_ADMIN_KEY: ${CODEBUDDY_ADMIN_KEY:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-codebuddy}
      ALLOW_ANONYMOUS: ${ALLOW_ANONYMOUS:-0}
      QODER_MODELS: ${QODER_MODELS:-lite}
      MODEL_ROUTES: ${MODEL_ROUTES:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-300}
      CONNECT_TIMEOUT: ${CONNECT_TIMEOUT:-15}
      HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-5}
      PANEL_ADMIN_KEY: ${PANEL_ADMIN_KEY:?请在 .env 设置 PANEL_ADMIN_KEY}
      PANEL_COOKIE_SECURE: ${PANEL_COOKIE_SECURE:-0}
      PANEL_BASE_DOMAIN: ${PANEL_BASE_DOMAIN:-localhost}
      CHECKIN_CONFIG: /data/checkin/config.json
      CHECKIN_LOG: /data/checkin/checkin.log
    volumes:
      - ./checkin:/data/checkin
    depends_on:
      qoder:
        condition: service_healthy
      codebuddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- Qoder 后端（含管理控制台）----------
  qoder:
    build:
      context: .
      dockerfile: docker/qoder.Dockerfile
    image: ai-ide-gateway/qoder
    restart: unless-stopped
    environment:
      QODER_HOST: 0.0.0.0
      QODER_PORT: "5050"
      QODER_ADMIN_PASSWORD: ${QODER_ADMIN_PASSWORD:?请在 .env 设置 QODER_ADMIN_PASSWORD}
      QODER_PAT: ${QODER_PAT:-}
      QODER_BACKEND_KEY: ${QODER_BACKEND_KEY:?请在 .env 设置 QODER_BACKEND_KEY}
      QODER_REQUIRE_AUTH: ${QODER_REQUIRE_AUTH:-1}
    volumes:
      - qoder-data:/data/.qoder
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ---------- WorkBuddy/CodeBuddy 后端（codebuddy2api admin 控制台）----------
  codebuddy:
    build:
      context: .
      dockerfile: docker/codebuddy.Dockerfile
    image: ai-ide-gateway/codebuddy
    restart: unless-stopped
    environment:
      ADMIN_KEY: ${CODEBUDDY_ADMIN_KEY:?请在 .env 设置 CODEBUDDY_ADMIN_KEY（>=20 位）}
      CODEBUDDY2OPENAI_KEY: ${CODEBUDDY_BACKEND_KEY:?请在 .env 设置 CODEBUDDY_BACKEND_KEY}
      CODEBUDDY_AUTH_DIR: /data/auth
      MANAGEMENT_DATA_DIR: /data/management
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - codebuddy-auth:/data/auth
      - codebuddy-management:/data/management
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ---------- 统一签到（默认只跑 Trae；用 profile 显式启用）----------
  # 启动前先：cp checkin/config.example.json checkin/config.json 并填 token
  # 启用：docker compose --profile checkin up -d
  checkin:
    profiles: ["checkin"]
    build:
      context: ./checkin
    image: ai-ide-gateway/checkin
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CHECKIN_ENABLE_TRAE: ${CHECKIN_ENABLE_TRAE:-1}
      CHECKIN_ENABLE_QODER: ${CHECKIN_ENABLE_QODER:-0}
      CHECKIN_ENABLE_WORKBUDDY: ${CHECKIN_ENABLE_WORKBUDDY:-0}
      CHECKIN_TIME_TRAE: ${CHECKIN_TIME_TRAE:-08:30}
      CHECKIN_TIME_QODER: ${CHECKIN_TIME_QODER:-10:05}
      CHECKIN_TIME_WORKBUDDY: ${CHECKIN_TIME_WORKBUDDY:-08:35}
      CHECKIN_CONFIG: /data/checkin/config.json
      CHECKIN_LOG: /data/checkin/checkin.log
    volumes:
      - ./checkin:/data/checkin

volumes:
  qoder-data:
  codebuddy-auth:
  codebuddy-management:
